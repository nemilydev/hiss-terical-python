name: Snake CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compliment engine
        run: python emily_surprise.py --compliment

      - name: Leaderboard (empty state)
        run: python emily_surprise.py --leaderboard

      - name: Haiku generator
        run: python emily_haiku.py --batch 3

      - name: Fortune teller
        run: python emily_fortune.py --batch 3
